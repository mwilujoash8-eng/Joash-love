<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SchoolLink - Digital School Operating System</title>
    <meta name="description" content="The official SchoolLink digital school website and educational portal with responsive smartphone and laptop views, embedded Zoom classrooms, Excel and Word studios, ECZ grading, Gemini AI, and student-parent portals." />
    <meta property="og:title" content="SchoolLink - Digital School Operating System" />
    <meta property="og:description" content="The official SchoolLink digital school website and educational portal with responsive smartphone and laptop views, embedded Zoom classrooms, Excel and Word studios, ECZ grading, Gemini AI, and student-parent portals." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-slate-950 text-slate-100">
    <noscript>
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #020617; color: #f8fafc; font-family: sans-serif; text-align: center; padding: 24px;">
        <div style="max-width: 460px; background: #0f172a; padding: 32px; border-radius: 24px; border: 1px solid #1e293b;">
          <h2 style="font-size: 20px; font-weight: bold; margin-bottom: 12px; color: #10b981;">SchoolLink Digital School Portal</h2>
          <p style="font-size: 14px; color: #94a3b8; line-height: 1.6;">
            Please enable JavaScript in your browser settings to access the official SchoolLink website and educational portal.
          </p>
        </div>
      </div>
    </noscript>
    <div id="root">
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #020617; color: #f8fafc; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="text-align: center; max-width: 420px; padding: 24px;">
          <div style="width: 60px; height: 60px; margin: 0 auto 16px; border-radius: 18px; background: linear-gradient(135deg, #059669, #0d9488); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(5, 150, 105, 0.4);">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
              <path d="M6 12v5c3 3 9 3 12 0v-5"/>
            </svg>
          </div>
          <h1 style="font-size: 20px; font-weight: 700; margin: 0 0 6px; color: #ffffff; letter-spacing: -0.025em;">SchoolLink</h1>
          <p style="font-size: 13px; color: #94a3b8; margin: 0 0 16px;">Loading SchoolLink Website & Portal...</p>
          <div style="width: 140px; height: 4px; background: #1e293b; border-radius: 9999px; margin: 0 auto; overflow: hidden; position: relative;">
            <div style="width: 60px; height: 100%; background: #10b981; border-radius: 9999px; position: absolute; left: 0; animation: schoollink-loader 1.2s infinite ease-in-out;"></div>
          </div>
        </div>
      </div>
      <style>
        @keyframes schoollink-loader {
          0% { left: -60px; }
          100% { left: 140px; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
